name: Release Windows launcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Validate release tag and signing credentials
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag v$tagVersion does not match package version $packageVersion."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw "Missing GitHub secret WIN_CSC_LINK."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "Missing GitHub secret WIN_CSC_KEY_PASSWORD."
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify launcher
        run: npm run check

      - name: Build signed Windows executables
        run: npx electron-builder --win --x64 --publish never

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem release-artifacts -Filter '*.exe' -File)
          if ($executables.Count -eq 0) {
            throw "No Windows executable was produced."
          }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($executable.Name) has an invalid Authenticode signature: $($signature.Status)."
            }
            Write-Host "$($executable.Name) signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem release-artifacts -File |
              Where-Object {
                $_.Name -eq 'latest.yml' -or
                $_.Extension -eq '.exe' -or
                $_.Extension -eq '.blockmap'
              } |
              Select-Object -ExpandProperty FullName
          )
          if ($assets.Count -lt 3) {
            throw "Expected signed executables and update metadata were not produced."
          }
          gh release create "${{ github.ref_name }}" $assets `
            --repo "${{ github.repository }}" `
            --title "Pinkward ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
